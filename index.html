<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>LifeQuest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Unbounded:wght@500;700&display=swap">
<style>
/* Concept: glowing glass phone. Home = locked hero card + 6 picture tiles. Swipe left = folder shelf. Skins: Neon (default), Dark, Light. */
:root{
  --bg:#03030b;
  --app-bg:#05061a;
  --bg-image:radial-gradient(60% 40% at 12% 0%,rgba(47,107,255,.24),transparent 70%),radial-gradient(60% 40% at 92% 100%,rgba(155,77,255,.22),transparent 70%);
  --app-glow:radial-gradient(90% 40% at 50% 0%,rgba(60,110,255,.17),transparent 70%),radial-gradient(80% 36% at 100% 100%,rgba(150,70,255,.17),transparent 70%);
  --fg:#eaf0ff;
  --muted:#98a4d9;
  --edge:#3f7cff;
  --edge-2:#a560ff;
  --edge-soft:rgba(63,124,255,.38);
  --glass:linear-gradient(160deg,#0d1450 0%,#060720 55%,#1a0b46 100%);
  --glass-flat:#050620;
  --sheen:rgba(150,190,255,.26);
  --track:rgba(120,140,255,.2);
  --chip-bg:rgba(63,124,255,.15);
  --on-hue:#03030b;
  --easy:#36e8c4;
  --medium:#54a0ff;
  --hard:#b06bff;
  --impossible:#ff58d4;
  --ok:#3dff9c;
  --gold:#ffcf4a;
  --on-ok:#02150b;
  --pic-base:#070a2e;
  --pic-ink:#eaf0ff;
  --tile-shadow:0 0 16px var(--edge-soft),0 0 2px var(--edge),inset 0 0 0 5px var(--glass-flat),inset 0 0 0 6px var(--edge-soft),inset 0 0 24px rgba(80,90,255,.26);
  --frame:0 0 34px var(--edge-soft),0 0 3px var(--edge),inset 0 0 44px rgba(63,124,255,.18);
  --ease:cubic-bezier(.22,1,.36,1);
  color-scheme:dark;
}
/* dark = plain graphite glass, no glow */
:root[data-skin="dark"]{
  --bg:#08090d;--app-bg:#0c0d13;--bg-image:none;--app-glow:none;
  --fg:#e9ebf5;--muted:#9096ad;--edge:#4d526b;--edge-2:#6b718c;--edge-soft:rgba(98,106,140,.45);
  --glass:linear-gradient(160deg,#1f2232 0%,#10111a 100%);--glass-flat:#0d0e15;--sheen:rgba(255,255,255,.1);
  --track:rgba(130,138,175,.22);--chip-bg:rgba(130,138,175,.14);--on-hue:#0a0b10;
  --easy:#62dcc0;--medium:#76acff;--hard:#b895ff;--impossible:#ff80c9;
  --ok:#43e08f;--gold:#f0c04a;--on-ok:#04150b;--pic-base:#161824;--pic-ink:#e9ebf5;
  --tile-shadow:0 6px 16px rgba(0,0,0,.55),0 0 0 1px var(--edge-soft),inset 0 0 0 5px var(--glass-flat),inset 0 0 0 6px var(--edge-soft);
  --frame:0 16px 44px rgba(0,0,0,.6),0 0 0 1px var(--edge-soft);
  color-scheme:dark;
}
/* light = soft pressed glass from the second reference */
:root[data-skin="light"]{
  --bg:#e6eaf3;--app-bg:#eef1f8;--bg-image:none;--app-glow:none;
  --fg:#1b2347;--muted:#58638a;--edge:#aeb8cf;--edge-2:#c9bee9;--edge-soft:rgba(130,145,180,.4);
  --glass:linear-gradient(160deg,#fbfcff 0%,#e1e6f1 100%);--glass-flat:#edf0f8;--sheen:rgba(255,255,255,.95);
  --track:rgba(120,135,170,.26);--chip-bg:rgba(120,135,170,.14);--on-hue:#ffffff;
  --easy:#087f6d;--medium:#1f56d6;--hard:#7634d1;--impossible:#b81e86;
  --ok:#0d9b5c;--gold:#a86d00;--on-ok:#ffffff;--pic-base:#dde3f3;--pic-ink:#1b2347;
  --tile-shadow:7px 9px 18px rgba(150,160,190,.55),-7px -7px 16px #ffffff,inset 0 0 0 5px var(--glass-flat),inset 0 0 0 6px var(--edge-soft);
  --frame:10px 14px 34px rgba(150,160,190,.5),-10px -10px 28px #ffffff,0 0 0 1px var(--edge-soft);
  color-scheme:light;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background-color:var(--bg);background-image:var(--bg-image);color:var(--fg);
  font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow:hidden;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--hl,var(--edge-2));outline-offset:3px}
h1,h2,h3,p{margin:0}

[data-lvl="easy"]{--h:var(--easy)}
[data-lvl="medium"]{--h:var(--medium)}
[data-lvl="hard"]{--h:var(--hard)}
[data-lvl="impossible"]{--h:var(--impossible)}
[data-lvl="combo"]{--h:var(--combo,var(--gold))}
[data-lvl="fav"]{--h:var(--edge-2)}

.stage{height:100%;display:flex;justify-content:center;align-items:center}
.case{--bezel:var(--bz,0px);position:relative;width:100%;max-width:440px;height:100%;max-height:900px;padding:var(--bezel,0px);
  border-radius:calc(38px + var(--bezel,0px));transition:padding .4s var(--ease)}
.app{
  position:relative;width:100%;height:100%;
  border-radius:38px;overflow:hidden;background:var(--app-glow),var(--app-bg);box-shadow:var(--frame);
  isolation:isolate;
}
.glass::after,.app::after{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:var(--ring-w,1.5px);
  background:linear-gradient(135deg,var(--r1,var(--edge)),var(--r2,var(--edge-2)));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
  pointer-events:none;
}
.app::after{z-index:40;--ring-w:2px}

.glass{position:relative;border-radius:var(--rad,22px);background:var(--glass);box-shadow:var(--tile-shadow);text-align:left}
.glass::before{
  content:"";position:absolute;inset:6px;border-radius:calc(var(--rad,22px) - 6px);pointer-events:none;
  background:linear-gradient(135deg,var(--sheen) 0%,transparent 38%);
}
.glass>*{position:relative;z-index:1}

/* pager */
.pager{position:absolute;inset:0;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;
  transition:transform .55s var(--ease),opacity .45s ease}
.track{display:flex;width:200%;height:100%;transition:transform .5s var(--ease);will-change:transform}
.screen{width:50%;height:100%;flex:none;min-width:0;display:flex;flex-direction:column;gap:14px;padding:20px 18px 44px}
.app[data-list="open"] .pager,.app[data-shop="open"] .pager{transform:translate3d(-9%,0,0) scale(.96);opacity:0}

.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.bar-r{display:flex;align-items:center;gap:8px;min-width:0}
.eyebrow{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700}
.bar h1{font-family:'Unbounded','Manrope',system-ui,sans-serif;font-weight:700;font-size:18px;line-height:1.2;margin-top:3px}
.total{display:flex;align-items:baseline;gap:5px;padding:8px 12px;border-radius:14px;background:var(--chip-bg);
  font-size:12px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.total b{font-family:'Unbounded',sans-serif;font-weight:500;font-size:14px;color:var(--ok)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:9px 14px 9px 10px;border-radius:14px;background:var(--chip-bg);
  font-size:13px;font-weight:700;color:var(--fg);flex:none;transition:transform .2s var(--ease)}
.chip:active{transform:scale(.94)}
.chip svg{width:16px;height:16px}
.gear{width:40px;height:40px;border-radius:14px;background:var(--chip-bg);display:grid;place-items:center;flex:none;color:var(--fg);transition:transform .25s var(--ease)}
.gear svg{width:18px;height:18px}
.gear:active{transform:rotate(60deg) scale(.92)}

/* quest card: picture left, about top right, done bottom right */
.acard{--rad:24px;display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;gap:10px;padding:12px;
  transition:box-shadow .35s,background .35s}
.pic{grid-row:1 / span 2;position:relative;border-radius:16px;overflow:hidden;min-height:150px;isolation:isolate;
  background:linear-gradient(var(--ang,150deg),color-mix(in srgb,var(--h) 58%,var(--pic-base)) 0%,var(--pic-base) 100%)}
.pic::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 50% at 30% 15%,rgba(255,255,255,.2),transparent 70%);z-index:0}
.pic-svg{position:absolute;inset:0;width:100%;height:100%;display:block;filter:var(--gfilter,none);transition:opacity .4s,filter .4s}
.stamp{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:var(--ok);color:var(--on-ok);
  display:grid;place-items:center;box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 35%,transparent),0 0 26px color-mix(in srgb,var(--ok) 70%,transparent);
  opacity:0;transform:scale(.3) rotate(-25deg);transition:opacity .25s,transform .45s var(--ease);z-index:3}
.stamp svg{width:24px;height:24px}
.pic::after{content:"";position:absolute;inset:0;z-index:2;opacity:0;transition:opacity .35s;
  background:linear-gradient(160deg,color-mix(in srgb,var(--ok) 60%,transparent),color-mix(in srgb,var(--ok) 22%,transparent))}
.acard.done .pic::after{opacity:1}
.acard.done .pic-svg{opacity:.5;filter:saturate(.4)}
.acard.done .stamp{opacity:1;transform:none}
.acard.done{--r1:var(--ok);--r2:var(--ok);
  background:linear-gradient(135deg,color-mix(in srgb,var(--ok) 20%,transparent),transparent 65%),var(--glass);
  box-shadow:var(--tile-shadow),0 0 26px color-mix(in srgb,var(--ok) 32%,transparent)}
.about{display:flex;flex-direction:column;gap:6px;min-width:0;padding:10px 12px 11px;border-radius:14px;background:var(--chip-bg);align-self:stretch}
.lvl{display:inline-flex;align-items:center;gap:7px;font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--h)}
.lvl i{width:7px;height:7px;border-radius:50%;background:var(--h);box-shadow:0 0 8px var(--h)}
.about h3{font-size:15px;font-weight:800;line-height:1.25;text-wrap:balance;overflow-wrap:anywhere}
.about p{font-size:13px;line-height:1.45;color:var(--muted);overflow-wrap:anywhere}
.acard.done .about h3{color:var(--ok)}
.donebtn{display:flex;align-items:center;justify-content:center;gap:9px;min-height:44px;padding:9px 12px;border-radius:14px;
  border:1.5px solid var(--edge-soft);font-size:13.5px;font-weight:800;letter-spacing:.02em;color:var(--fg);background:var(--chip-bg);
  transition:background .25s,color .25s,border-color .25s,transform .2s var(--ease),box-shadow .3s}
.dchk{width:22px;height:22px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;opacity:.8;transition:all .25s}
.dchk svg{width:13px;height:13px;opacity:0;transform:scale(.4);transition:opacity .2s,transform .35s var(--ease)}
.donebtn:active{transform:scale(.95)}
.donebtn[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--on-ok);box-shadow:0 0 20px color-mix(in srgb,var(--ok) 45%,transparent)}
.donebtn[aria-pressed="true"] .dchk{background:var(--on-ok);border-color:var(--on-ok);color:var(--ok);opacity:1}
.donebtn[aria-pressed="true"] .dchk svg{opacity:1;transform:none}

/* hero */
.hero{flex:none}
.hero .about h3{font-family:'Unbounded','Manrope',system-ui,sans-serif;font-weight:700;font-size:clamp(15px,4.6vw,18px);line-height:1.2}
.hero .about p{font-size:13.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hero .about h3{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hero .hero-card{height:262px}
.hero .about{overflow:hidden}
.hero .pic{min-height:0}
.swap .pic,.swap .about{animation:swap .38s var(--ease)}
@keyframes swap{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* tiles */
.grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,minmax(52px,1fr));gap:14px}
.tile{--rad:20px;padding:0;overflow:hidden;min-height:0;display:block;transition:transform .3s var(--ease),box-shadow .3s}
.tile .pic{position:absolute;inset:5px;grid-row:auto;border-radius:15px;min-height:0}
.tile .shade{position:absolute;inset:5px;border-radius:15px;z-index:3;background:linear-gradient(to top,rgba(3,4,16,.82) 0%,rgba(3,4,16,.35) 42%,transparent 72%);pointer-events:none}
.tile .t{position:absolute;left:14px;right:14px;bottom:11px;z-index:4;color:#fff;font-weight:800;font-size:12.5px;line-height:1.25;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-wrap:balance;text-align:left;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.tile .tick{position:absolute;top:12px;right:12px;z-index:4;width:22px;height:22px;border-radius:50%;background:var(--ok);color:var(--on-ok);display:grid;place-items:center;
  opacity:0;transform:scale(.4);transition:opacity .25s,transform .35s var(--ease);box-shadow:0 0 14px color-mix(in srgb,var(--ok) 60%,transparent)}
.tile .tick svg{width:13px;height:13px}
.tile.done .tick{opacity:1;transform:none}
.tile.done{--r1:var(--ok);--r2:var(--ok)}
.tile.done .pic-svg{opacity:.55;filter:saturate(.45)}
.tile:active{transform:scale(.96)}
.tile[aria-pressed="true"]{--r1:var(--h);transform:translateY(-2px);box-shadow:var(--tile-shadow),0 0 26px color-mix(in srgb,var(--h) 45%,transparent)}
.tile.done[aria-pressed="true"]{--r1:var(--ok)}

.hint{display:flex;justify-content:center}
.hint button{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted);padding:6px 10px}
.hint svg{width:16px;height:16px;animation:nudge 1.8s var(--ease) infinite}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(-6px)}}

.dots{position:absolute;left:0;right:0;bottom:16px;display:flex;justify-content:center;gap:8px;z-index:3;pointer-events:none;transition:opacity .3s}
.dots i{width:7px;height:7px;border-radius:4px;background:var(--track);transition:width .4s var(--ease),background .3s}
.dots i.on{width:22px;background:linear-gradient(90deg,var(--edge),var(--edge-2))}
.app[data-list="open"] .dots{opacity:0}

/* scrollers */
.scroller{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;touch-action:pan-y;
  margin-inline:-18px;padding-inline:18px;padding-block:14px 12px;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 14px,#000 calc(100% - 22px),transparent 100%);
  mask-image:linear-gradient(to bottom,transparent 0,#000 14px,#000 calc(100% - 22px),transparent 100%)}
.scroller::-webkit-scrollbar{display:none}

/* folders */
.folders{display:flex;flex-direction:column;gap:26px;padding-top:6px}
.folder{--rad:28px;--r1:var(--h);width:100%;padding:24px 22px 20px;display:flex;flex-direction:column;gap:14px;transition:transform .3s var(--ease)}
.folder:active{transform:scale(.975)}
.folder .tab{position:absolute;top:-9px;left:26px;width:78px;height:10px;border-radius:8px 8px 0 0;background:var(--h);box-shadow:0 0 14px color-mix(in srgb,var(--h) 60%,transparent)}
.f-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.f-top h3{font-family:'Unbounded','Manrope',system-ui,sans-serif;font-weight:700;font-size:22px;color:var(--h)}
.meter{display:flex;gap:4px}
@media (max-height:740px){.hero .hero-card{height:196px}.hero .about p{display:none}.hint{display:none}.dhead{display:none}.screen{gap:10px}}
.lvrow{display:flex;align-items:center;gap:10px;flex:none;margin-top:-6px}
.lvbadge{font-family:'Unbounded','Manrope',system-ui,sans-serif;font-weight:700;font-size:11.5px;padding:6px 11px;border-radius:99px;border:1.5px solid var(--edge-soft);background:var(--chip-bg);color:var(--fg);white-space:nowrap}
.lvbadge b{color:var(--gold);font-size:13px}
.lvrow .pbar{flex:1;height:6px}
.lvxp{font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.daily{display:flex;flex-direction:column;gap:7px;flex:none}
.dhead{margin:0;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700}
.drow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.dpick{--rad:14px;--r1:var(--h);padding:8px 9px 8px 11px;text-align:left;display:flex;flex-direction:column;gap:3px;min-height:50px;color:var(--fg);font:inherit}
.dpick .dl{font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--h)}
.dpick .dt{font-size:11.5px;font-weight:800;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.dpick.done .dl::after{content:" \2713";color:var(--ok)}
.dpick[aria-pressed="true"]{box-shadow:0 0 0 2px var(--h)}
.favbtn{width:28px;height:28px;display:grid;place-items:center;border-radius:50%;color:var(--muted);flex:none}
.favbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8}
.favbtn[aria-pressed="true"]{color:var(--gold)}
.favbtn[aria-pressed="true"] svg{fill:currentColor}
.searchrow{position:relative;margin-bottom:16px}
.searchrow svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;pointer-events:none}
.q{width:100%;padding:13px 14px 13px 42px;border-radius:16px;border:1.5px solid var(--edge-soft);background:var(--chip-bg);color:var(--fg);font:inherit;font-weight:600;font-size:14px;outline:none;-webkit-appearance:none;appearance:none}
.q:focus{border-color:var(--edge-2)}
.q::placeholder{color:var(--muted)}
.empty{list-style:none;text-align:center;color:var(--muted);font-size:13.5px;font-weight:600;padding:30px 10px;line-height:1.5}
.gcard{--rad:24px;width:100%;text-align:left;display:grid;grid-template-columns:88px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 16px 12px 12px;color:inherit;font:inherit}
.gcard .pic{grid-row:auto;width:88px;height:100px;min-height:0;border-radius:16px}
.gcard .pbar{flex:none;width:100%;height:7px;margin-top:2px}
.gabout{min-width:0;display:flex;flex-direction:column;gap:6px}
.gabout h3{margin:0;font-size:17px;line-height:1.2}
.gsub{margin:0;font-size:12px;font-weight:700;color:var(--muted)}
.gchev{width:22px;height:22px;color:var(--h)}
.gcard.done .gsub{color:var(--ok)}
.cbtag{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--h);border:1px solid color-mix(in srgb,var(--h) 55%,transparent);border-radius:99px;padding:4px 10px}
.meter i{width:14px;height:5px;border-radius:3px;background:var(--track)}
.meter i.on{background:var(--h);box-shadow:0 0 8px color-mix(in srgb,var(--h) 60%,transparent)}
.f-desc{font-size:14px;line-height:1.5;color:var(--muted)}
.f-foot{display:flex;align-items:center;gap:14px}
.pbar{flex:1;height:7px;border-radius:4px;background:var(--track);overflow:hidden}
.pbar b{display:block;height:100%;width:0;border-radius:4px;background:var(--ok);box-shadow:0 0 10px color-mix(in srgb,var(--ok) 70%,transparent);transition:width .7s var(--ease)}
.f-count{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--fg);white-space:nowrap}
.f-count span{color:var(--muted);font-weight:600}
.f-open{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--h)}
.f-go{display:flex;align-items:center;gap:6px}
.f-open svg{width:15px;height:15px}
.f-hour{font-size:11px;letter-spacing:.06em;text-transform:none;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

/* anti-cheat lock + toast */
.dlock{display:none;width:20px;height:20px;place-items:center}
.dlock svg{width:16px;height:16px}

<script>
window.VD = (function(){

  function summer(){

  function egg(cx, cy, s, col, pat, rot, ink){

    if (pat === 'zig'){
      var d = 'M' + n(cx - hw(0)) + ' ' + cy, k = 0, step = hw(0) / 3;
      for (var x = -hw(0) + step; x <= hw(0) + 0.1; x += step){ d += 'L' + n(cx + x) + ' ' + n(cy + (k++ % 2 ? 4 * s : -4 * s)); }

  }
  function tulip(x, y, c){
    return L('M' + x + ' ' + y + ' V' + (y - 66), '#5f9f58', 3.4) + P('M' + x + ' ' + (y - 14) + ' q-22 -4 -24 -30 q20 4 24 30z', '#78b86c') +
      P('M' + (x - 13) + ' ' + (y - 68) + ' Q' + (x - 15) + ' ' + (y - 98) + ' ' + x + ' ' + (y - 92) + ' Q' + (x + 15) + ' ' + (y - 98) + ' ' + (x + 13) + ' ' + (y - 68) + ' Q' + x + ' ' + (y - 58) + ' ' + (x - 13) + ' ' + (y - 68) + 'z', c);
  }
  function easter(){
    var o = R(0, 0, 400, 800, '#fff3da') + R(0, 0, 400, 300, '#ffe6ef') + R(0, 0, 400, 150, '#fbd9e6');

    o += L('M-10 30 Q200 112 410 30', '#6b5b4f', 2.4);

      o += P('M' + n(px - 15) + ' ' + n(py - 1) + ' L' + n(px + 15) + ' ' + n(py - 1) + ' L' + n(px) + ' ' + n(py + 34) + 'z', cols[i % 5]);
    }

    o += tulip(36, 770, '#f2789f') + tulip(66, 782, '#ffc65c') + tulip(352, 776, '#f2789f') + tulip(326, 786, '#9ec4f5');
    o += egg(86, 632, 1.1, '#f2a0c8', 'zig', -12, '#fff3da') + egg(180, 700, 1, '#ffd37a', 'stripe', 8, '#ee7f5a') + egg(300, 640, 1.15, '#9fd8c3', 'dots', 14, '#ffffff');

  }

  function leafShape(x, y, s, c, rot){ return '<g transform="translate(' + n(x) + ' ' + n(y) + ') rotate(' + n(rot) + ') scale(' + s + ')">' + P('M0 -9 Q9 -3 0 10 Q-9 -3 0 -9z', c) + L('M0 -7 V9', 'rgba(60,20,0,.35)', 1.2) + '</g>'; }
  function pumpkin(x, y, s, face){

    o += P('M' + n(x - 3 * s) + ' ' + n(y - 20 * s) + ' q2 -9 ' + n(9 * s) + ' -11 l' + n(2 * s) + ' ' + n(3 * s) + ' q-5 3 -' + n(4 * s) + ' ' + n(10 * s) + 'z', '#587a34');

      o += P('M' + n(x - 11 * s) + ' ' + n(y - 4 * s) + ' l' + n(7 * s) + ' ' + n(-7 * s) + ' l' + n(4 * s) + ' ' + n(9 * s) + 'z', '#ffd36b') + P('M' + n(x + 11 * s) + ' ' + n(y - 4 * s) + ' l' + n(-7 * s) + ' ' + n(-7 * s) + ' l' + n(-4 * s) + ' ' + n(9 * s) + 'z', '#ffd36b');

    }

  }
  function autumn(){

    o += P('M292 800 L300 540 Q302 490 290 440 L314 440 Q304 490 310 540 L322 800z', '#4f2f18') + L('M300 500 Q268 470 246 430', '#4f2f18', 9) + L('M306 480 Q342 450 356 408', '#4f2f18', 8);

    o += L('M190 705 q12 -10 24 0', '#5a3a1e', 2) + L('M232 690 q9 -8 18 0', '#5a3a1e', 2);

  function pine(x, y, s){
    var o = R(x - 3 * s, y, 6 * s, 14 * s, '#4a2f20');

  }
  function winter(){
    var r = rng(5), o = R(0, 0, 400, 800, '#1d2b52') + R(0, 0, 400, 300, '#162244');
    for (var i = 0; i < 38; i++) o += C(r() * 400, r() * 380, 0.8 + r() * 1.6, '#ffffff', 0.5 + r() * 0.5);

    o += R(150, 590, 76, 54, '#7a4b2e') + P('M140 592 L188 556 L236 592z', '#e4eef9') + R(206, 556, 12, 22, '#5a3a26') + R(170, 608, 20, 22, '#ffd36b') + R(176, 614, 8, 10, '#f0a53a', 0.0) + L('M180 608 V630 M170 619 H190', '#c98a2a', 1.6) + R(198, 616, 18, 28, '#4a2f20');

    persist(); refresh(); renderShop(); rateHint = 1.35; toast("Unlocked " + it.name + ". Tap Equip to use it.");
  }
  var SCENE_TONE = { summer: "light", easter: "light", sakura: "light", autumn: "light", winter: "dark", halloween: "dark" };
  function equipItem(kind, it){
    if (kind === "bundles") P.eq = { colour: it.colour, "case": it["case"], icons: it.icons, scene: it.scene };
    else P.eq[SLOT[kind]] = it.id;
    var sc = P.eq.scene, tone = SCENE_TONE[sc];
    if ((kind === "bundles" || kind === "scenes") && tone && S.skin !== tone){ S.skin = tone; saveS(); smooth(function(){ applySkin(); tintLevels(); paintSettings(); }); }
    persist(); applyLook(); renderShop();
  }
  function shopItem(kind, it){
    var el = document.createElement("div"); el.className = "glass sitem";
    var owned = isOwned(kind, it), eq = owned && isEquipped(kind, it);
    if (eq) el.classList.add("on");
    var pv = document.createElement("div"); pv.className = "sprev"; pv.innerHTML = preview(kind, it); el.appendChild(pv);
    var info = document.createElement("div"); info.className = "sinfo";
    var h = document.createElement("h4"); h.textContent = it.name;
    var p = document.createElement("p"); p.textContent = it.blurb || "";
    info.appendChild(h); info.appendChild(p); el.appendChild(info);
    var b = document.createElement("button"); b.type = "button"; b.className = "sbtn";
    if (eq){ b.classList.add("eq"); b.textContent = "Equipped"; }
    else if (owned){ b.textContent = "Equip"; b.addEventListener("click", function(){ equipItem(kind, it); }); }
    else {
      var armed = armedBuy === oid(kind, it);
      b.textContent = armed ? "Tap to confirm · " + it.price : "Buy · " + it.price + " pts";
      if (armed) b.classList.add("armed"); else if (balance() < it.price) b.classList.add("need");
      b.addEventListener("click", function(){ buyItem(kind, it); });
    }
    el.appendChild(b);
    return el;
  }
  function buildTabs(){
    var tabs = $("tabs"); tabs.innerHTML = "";
    TABS.forEach(function(t){
      var b = document.createElement("button"); b.type = "button"; b.className = "tab"; b.dataset.tab = t[0];
      b.setAttribute("role", "tab"); b.textContent = t[1];
      b.addEventListener("click", function(){ shopTab = t[0]; armedBuy = null; renderShop(); $("shopScroll").scrollTop = 0; });
      tabs.appendChild(b);
    });
  }
  function renderShop(){
    Array.prototype.forEach.call($("tabs").children, function(b){ b.setAttribute("aria-selected", b.dataset.tab === shopTab ? "true" : "false"); });
    var g = $("sgrid"); g.innerHTML = ""; g.className = "sgrid" + (shopTab === "bundles" ? " one" : "");
    LIST[shopTab].forEach(function(it){ g.appendChild(shopItem(shopTab, it)); });
  }
  function openShop(){
    app.dataset.shop = "open"; shop.removeAttribute("aria-hidden"); syncInert(); renderShop();
    $("shopScroll").scrollTop = 0;
    setTimeout(function(){ $("shopBack").focus({ preventScroll: true }); }, 60);
  }
  function closeShop(){
    if (app.dataset.shop !== "open") return;
    app.dataset.shop = "closed"; shop.setAttribute("aria-hidden", "true"); syncInert();
  }
  Array.prototype.forEach.call(document.querySelectorAll("button.ptschip"), function(b){ b.addEventListener("click", openShop); });
  $("shopBack").addEventListener("click", closeShop);
  var ss = null;
  shop.addEventListener("pointerdown", function(e){ ss = { x: e.clientX, y: e.clientY }; });
  shop.addEventListener("pointerup", function(e){
    if (!ss) return;
    var dx = e.clientX - ss.x, dy = e.clientY - ss.y; ss = null;
    if (dx > 70 && Math.abs(dy) < Math.abs(dx) * 0.6) closeShop();
  });
  shop.addEventListener("pointercancel", function(){ ss = null; });

  applySkin();
  buildTabs();
  applyLook();
  buildFeatured();
  buildDaily();
  select(0, false);
  setPage(0);
  var why0 = bootCheat || audit();
  if (why0) setTimeout(function(){ punish(why0); }, 500); else persist();
})();
</script>
